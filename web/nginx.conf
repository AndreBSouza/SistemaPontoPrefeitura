# nginx do painel: fallback de SPA (React Router) + proxy de /api para o backend.
# Ajuste 'backend' para o host/serviço do backend no seu deploy (no compose de prod é o serviço 'backend').
#
# TLS: termine HTTPS numa borda à frente (LB/ingress) OU habilite o server 443 abaixo com certificado.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança (valem para o app servido daqui).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: habilite quando estiver 100% em HTTPS (evita fixar HSTS em ambiente sem TLS).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cache agressivo dos assets versionados; index.html sempre revalida.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCREVE (não anexa) o X-Forwarded-For: o backend usa o IP para rate-limit pré-auth,
        # então o cliente NÃO pode forjar o cabeçalho. Como o backend não publica 8080, o único
        # caminho até ele é por aqui, e $remote_addr é o IP real do cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Só o health/info são públicos. metrics/prometheus NÃO passam pela web pública — o scrape do
    # Prometheus deve falar direto com o backend na rede interna (backend:8080).
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }
    location = /actuator/info {
        proxy_pass http://backend:8080/actuator/info;
    }

    # SPA: qualquer rota do front cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
