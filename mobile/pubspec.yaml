name: ponto_municipal_mobile
description: "App de ponto eletronico do servidor (Ponto Municipal)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  uuid: ^4.5.1
  # Offline-first / sincronizacao
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.4
  # Geolocalizacao / geofencing
  geolocator: ^13.0.1
  # Biometria facial (liveness on-device)
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.14.0
  # Login unico por aparelho (token em armazenamento seguro)
  flutter_secure_storage: ^9.2.2
  # Verificacao no aparelho (digital/PIN/desenho) quando o orgao exige
  local_auth: ^2.3.0
  # Lembretes de batida (notificacoes locais agendadas, com som proprio)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # Acessibilidade por voz (12.4.13): falar o status e bater por comando de voz (idosos/PCD)
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Exigido pelo Shorebird (code push / OTA) — ver docs/shorebird-ota.md.
    - shorebird.yaml
